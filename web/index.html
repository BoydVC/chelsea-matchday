<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chelsea Matchday · Stamford Bridge Wall</title>
<link rel="stylesheet" href="style.css">
<!--MATCHDATA-->
<!--RESEARCH-->
</head>
<body>
<div id="sky">
  <div class="flood f1"></div>
  <div class="flood f2"></div>
  <div class="flood f3"></div>
</div>
<div id="page">
  <header class="wall-mast" id="mast"></header>
  <section class="form-strip" id="formstrip"></section>
  <section class="wall-grid">
    <div class="panel hero" id="hero"></div>
    <div class="panel vibe" id="vibe"></div>
    <div class="panel lineup" id="lineup"></div>
    <div class="panel news" id="news"></div>
  </section>
  <section class="wall-grid mid">
    <div class="panel keys-panel" id="keys"></div>
    <div class="panel h2h-panel" id="h2h"></div>
  </section>
  <section class="wall-grid low">
    <div class="panel table-panel" id="table"></div>
    <div class="panel side">
      <div class="panel nested" id="ctx"></div>
      <div class="panel nested" id="line"></div>
      <div class="panel nested" id="leaders"></div>
    </div>
  </section>
  <section class="panel stats-panel" id="stats"></section>
  <section class="wall-grid even">
    <div class="panel" id="form"></div>
    <div class="panel" id="results"></div>
  </section>
  <section class="panel audit-panel" id="audit"></section>
  <footer class="panel sources-panel" id="sources"></footer>
</div>
<script src="app.js"></script>
</body>
</html>
